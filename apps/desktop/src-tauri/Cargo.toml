[package]
name = "cyberloom"
description = "The Cyberloom desktop shell: a window, and a socket to the engine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "cyberloom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Tauri decides "dev" or "release" by this feature, not by the cargo profile:
# without it the window loads the Vite dev server's URL and, with no dev server
# running, shows "Could not connect to localhost". The Tauri CLI turns it on
# for `tauri build`; a plain `cargo build --release` has to be told —
# `--features custom-protocol` — and build.rs refuses a release build that
# was not, so the mistake is a compile error rather than a blank window.
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
loomd = { path = "../../../crates/loomd" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
