[package]
name = "loomd"
description = "The Cyberloom engine daemon: a socket, a workspace, and the graphs in it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
block-kinds = { path = "../block-kinds" }
block-source = { path = "../block-source" }
graph-format = { path = "../graph-format" }
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
thiserror.workspace = true
specta-typescript.workspace = true
specta-serde.workspace = true
ureq = { version = "3.4.0", features = ["json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serialport = { version = "4.10.0", default-features = false }
